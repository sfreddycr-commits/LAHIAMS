# LAHIAM'S — Apache 2.4 VirtualHost (Wiazart Core stack)
# Asume: PHP 8.3 (mod_php o php-fpm), MySQL 8, DocumentRoot en public/.
# El .env vive en /var/www/html/.env (fuera del repo, permisos 600).
<VirtualHost *:80>
    ServerName lahiams.local
    DocumentRoot /var/www/html/public

    # ---------- Seguridad: CSP estricta + headers ----------
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), microphone=()"

    # ---------- SPA (vanilla) ----------
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # ---------- API (front controller PHP) ----------
    Alias /api /var/www/html/api
    <Directory /var/www/html/api>
        Require all granted
        FallbackResource /index.php
        <FilesMatch \.php$>
            # Con mod_php:
            SetHandler application/x-httpd-php
            # Con php-fpm descomenta:
            # SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # Caché de rate-limiter (debe ser escribible por www-data)
    <Directory /var/www/html/api/cache>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lahiams_error.log
    CustomLog ${APACHE_LOG_DIR}/lahiams_access.log combined
</VirtualHost>
